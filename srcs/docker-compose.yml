services:
  mariadb:
    build: requirements/mariadb
    container_name: mariadb
    image: mariadb
    restart: always
    networks:
      - inception
    volumes:
      - mariadb_data:/var/lib/mysql
    env_file:
      - .env
    secrets:
      - db_password.txt
      - db_root_password.txt
  
  wordpress:
    build: requirements/wordpress
    container_name: wordpress
    restart: always
    image: wordpress
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html
    env_file:
      - .env
    depends_on:
      - mariadb
    secrets:
      - credentials.txt
      - db_password.txt
      - db_root_password.txt
  
  nginx:
    build: requirements/nginx
    container_name: nginx
    restart: always
    image: nginx
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html:ro  
    ports:
      - "443:443"
    depends_on:
      - wordpress


networks:
  inception:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/vokotera/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/vokotera/data/wordpress

secrets:
  db_password.txt:
    file: ../secrets/db_password.txt
  db_root_password.txt:
    file: ../secrets/db_root_password.txt
  credentials.txt:
    file: ../secrets/credentials.txt