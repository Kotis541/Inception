services:
  mariadb:
    build: requirements/mariadb
    container_name: mariadb
    image: mariadb
    restart: always
    networks:
      - inception
    volumes:
      - mariadb_data:/var/lib/mysql
    env_file:
      - .env
    secrets:
      - db_password.txt
      - db_root_password.txt
  
  wordpress:
    build: requirements/wordpress
    container_name: wordpress
    restart: always
    image: wordpress
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html
    env_file:
      - .env
    depends_on:
      - mariadb
      - redis
    secrets:
      - wp_admin_password.txt
      - wp_user_password.txt
      - db_password.txt
      - db_root_password.txt
  
  nginx:
    build: requirements/nginx
    container_name: nginx
    restart: always
    image: nginx
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html:ro  
    ports:
      - "443:443"
    depends_on:
      - wordpress
      - website
      - adminer
      - portainer
  
  redis:
    build: bonus/redis
    container_name: redis
    restart: always
    image: redis
    networks:
      - inception

  vsftpd:
    build: bonus/vsftpd
    container_name: vsftpd
    restart: always
    image: vsftpd
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html
    ports:
      - "21:21"
      - "30000-30100:30000-30100"
    env_file:
      - .env
    secrets:
      - ftp_pass.txt
  
  website:
    build: bonus/website
    container_name: website
    restart: always
    image: website
    networks:
      - inception
  
  adminer:
    build: bonus/adminer
    container_name: adminer
    restart: always
    image: adminer
    networks:
      - inception
    depends_on:
      - mariadb
  
  portainer:
    build: bonus/portainer
    container_name: portainer
    restart: always
    image: portainer
    networks:
      - inception
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data/portainer

networks:
  inception:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/vokotera/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/vokotera/data/wordpress
  portainer_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/vokotera/data/portainer

secrets:
  db_password.txt:
    file: ../secrets/db_password.txt
  db_root_password.txt:
    file: ../secrets/db_root_password.txt
  wp_admin_password.txt:
    file: ../secrets/wp_admin_password.txt
  wp_user_password.txt:
    file: ../secrets/wp_user_password.txt
  ftp_pass.txt:
    file: ../secrets/ftp_pass.txt